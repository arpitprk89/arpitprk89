s;animation-duration:4.1s"/><circle class="tw" cx="922" cy="96" r="1.6" fill="#fff" style="animation-delay:2.66s;animation-duration:3.0s"/><circle class="tw" cx="955" cy="114" r="1" fill="#fff" style="animation-delay:1.83s;animation-duration:3.5s"/><circle class="tw" cx="456" cy="220" r="1.2" fill="#fff" style="animation-delay:0.39s;animation-duration:2.7s"/><circle class="tw" cx="810" cy="247" r="1.6" fill="#fff" style="animation-delay:0.24s;animation-duration:3.3s"/><circle class="tw" cx="1135" cy="95" r="1" fill="#fff" style="animation-delay:2.46s;animation-duration:4.6s"/><circle class="tw" cx="580" cy="204" r="1.6" fill="#fff" style="animation-delay:2.96s;animation-duration:4.0s"/><circle class="tw" cx="789" cy="83" r="1" fill="#fff" style="animation-delay:0.25s;animation-duration:2.5s"/><circle class="tw" cx="487" cy="27" r="1.6" fill="#fff" style="animation-delay:2.49s;animation-duration:2.5s"/><circle class="tw" cx="587" cy="25" r="1" fill="#fff" style="animation-delay:1.26s;animation-duration:3.1s"/><circle class="tw" cx="1169" cy="105" r="1" fill="#fff" style="animation-delay:2.07s;animation-duration:3.5s"/><circle class="tw" cx="120" cy="140" r="1.6" fill="#fff" style="animation-delay:1.19s;animation-duration:3.2s"/>
