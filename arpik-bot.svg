<g class="b"><rect x="250" y="50" width="170" height="52" rx="16" fill="#0f1a3c" stroke="#19e6ff"/><text x="335" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#dff6ff">Tell me what's on your mind.</text></g>
