<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="ARPIK, the animated robot companion, greeting in different languages" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050c"/><stop offset=".6" stop-color="#0a1230"/><stop offset="1" stop-color="#1b1236"/></linearGradient>
<radialGradient id="moon"><stop offset="0" stop-color="#fff6dc"/><stop offset=".6" stop-color="#e9cf8f"/><stop offset="1" stop-color="#e9cf8f" stop-opacity="0"/></radialGradient>
<radialGradient id="cy"><stop offset="0" stop-color="#19e6ff" stop-opacity=".5"/><stop offset="1" stop-color="#19e6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="gd"><stop offset="0" stop-color="#ffcf70" stop-opacity=".45"/><stop offset="1" stop-color="#ffcf70" stop-opacity="0"/></radialGradient>
<linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19e6ff"/><stop offset="1" stop-color="#a23bff"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#F3DCA0"/><stop offset=".5" stop-color="#D4AF6A"/><stop offset="1" stop-color="#B8924A"/></linearGradient></defs><style>.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.fl{animation:fl 4.5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-9px)}}
.rise{animation:rise 7s linear infinite;opacity:0}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(-120px);opacity:0}}
.in{opacity:0;animation:in 2s ease forwards}@keyframes in{to{opacity:1}}
.ss{animation:ss 9s linear infinite;opacity:0}@keyframes ss{0%{transform:translate(0,0);opacity:0}4%{opacity:1}16%{transform:translate(420px,210px);opacity:0}100%{opacity:0}}
.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
.hb{animation:hb 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes hb{0%,100%{transform:scale(1);opacity:.7}14%{transform:scale(1.08);opacity:1}28%{transform:scale(1.01)}42%{transform:scale(1.1);opacity:1}}
.b{animation:b 9s infinite;opacity:0}.b2{animation-delay:3s}.b3{animation-delay:6s}@keyframes b{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}</style>
