<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-label="Key numbers: 9 projects, 3 certificates, 88.40 percent in Class XI, 12 voice languages" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.08}50%{opacity:.7}}
.rv{opacity:0;animation:rv 1.8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pl{animation:pl 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}@keyframes pl{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4.5)}}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 2.6s .4s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.sp{animation:sp 90s linear infinite;transform-origin:880px 270px}@keyframes sp{to{transform:rotate(360deg)}}</style><rect width="1200" height="170" rx="16" fill="#05070d" stroke="#fff" stroke-opacity=".12"/><g class="rv" style="animation-delay:0.2s"><text x="150" y="86" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="200" font-size="52" fill="#fff">9</text><text x="150" y="120" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#8b93a8">PROJECTS BUILT</text></g><line x1="300" y1="40" x2="300" y2="130" stroke="#fff" stroke-opacity=".15"/><g class="rv" style="animation-delay:0.45s"><text x="450" y="86" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="200" font-size="52" fill="#fff">3</text><text x="450" y="120" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#8b93a8">HACKERRANK CERTIFICATES</text></g><line x1="600" y1="40" x2="600" y2="130" stroke="#fff" stroke-opacity=".15"/><g class="rv" style="animation-delay:0.7s"><text x="750" y="86" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="200" font-size="52" fill="#fff">88.40%</text><text x="750" y="120" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#8b93a8">CLASS XI, FIRST DIVISION</text></g><line x1="900" y1="40" x2="900" y2="130" stroke="#fff" stroke-opacity=".15"/><g class="rv" style="animation-delay:0.95s"><text x="1050" y="86" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="200" font-size="52" fill="#fff">12</text><text x="1050" y="120" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="3" fill="#8b93a8">VOICE LANGUAGES IN ARPIK.AI</text></g></svg>